name: Build and offline tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build-and-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Audit public source manifest
        run: .\tools\publish-github.ps1

      - name: Build optimized .NET Framework Release
        run: .\tools\build.ps1 -Configuration Release

      - name: Run x86 offline regressions and planner benchmarks
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts\ci -Force | Out-Null
          & .\tests\Chaite.Tests\bin\Release\net48\Chaite.Tests.exe |
            Tee-Object -FilePath artifacts\ci\offline-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Offline regressions failed: $LASTEXITCODE" }

      - name: Check native result validation without loading the game
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-boss-evidence.ps1 |
            Tee-Object -FilePath artifacts\ci\native-evidence-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Native evidence regressions failed: $LASTEXITCODE" }

      - name: Check per-Boss readiness aggregation with synthetic evidence
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-boss-readiness.ps1 |
            Tee-Object -FilePath artifacts\ci\boss-readiness-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Readiness regressions failed: $LASTEXITCODE" }

      - name: Check native motion evidence gate without launching Terraria
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\test-native-motion-evidence.ps1 |
            Tee-Object -FilePath artifacts\ci\motion-evidence-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Motion evidence regressions failed: $LASTEXITCODE" }

      - name: Retain offline test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-log
          path: artifacts/ci/*.log
          if-no-files-found: warn
          retention-days: 14

      # Deliberately do not run verify-api-contract, prepare-game-probe,
      # start-isolated-test, installation or any actual Terraria process in CI.
      # Those require a locally owned, hash-verified vanilla game installation.
